spring.application.name=Drive2

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.yaml
spring.liquibase.url=jdbc:postgresql://localhost:5432/drive
spring.liquibase.user=postgres
spring.liquibase.password=1234

server.servlet.session.cookie.name=SESSION
server.servlet.session.tracking-modes=COOKIE

minio.endpoint = http://localhost:9000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.datasource.url=jdbc:postgresql://localhost:5432/drive
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

minio.access.key=minioadmin
minio.secret.key=minioadmin
