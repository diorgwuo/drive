services:
  redis:
    image: redis:latest
    container_name: drive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - drive-network

  postgres:
    image: postgres:15.19
    container_name: drive-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: drive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drive-network

  minio:
    image: minio/minio:latest
    container_name: drive-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - drive-network
volumes:
  redis-data:
  postgres-data:
  minio-data:

networks:
  drive-network:

